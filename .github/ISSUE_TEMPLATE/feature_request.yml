name: 기능 제안
description: 새 기능이나 개선 아이디어
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 어떤 상황에서 무엇이 불편한가요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
      description: 원하는 동작이나 CLI 인터페이스 예시
      placeholder: 'law-cli --semantic "질의" --preset 세금'
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
    validations:
      required: false
